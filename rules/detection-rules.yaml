# SOC-ify Sigma-style Detection Rules
# Target: nginx access logs (index pattern: nginx-access-*)
# Each rule describes: detection query, severity, confidence, tags, false-positive guidance.
# These are EXECUTED via the transform+scheduled script pipeline (basic-license compatible),
# NOT via Elastic Security detection rules (which require a trial+/paid license).
#
# Rule IDs are stable so the alert index can dedupe/reference them.
#
# mitre.* maps each rule to the MITRE ATT&CK framework (attack.mitre.org) — the shared
# language used across commercial SOC products. Keeping this lets the system "speak the
# industry standard" and enables ATT&CK-centric triage/dashboarding.

applies_to: "index: nginx-access-* | field: soc.attack_class (when enrich pipeline applied) OR path/args/user_agent raw fields"

rules:
  # [1] SQL Injection - classic signatures
  - id: R-001
    title: "SQL Injection - Classic Payload"
    severity: high
    confidence: 0.85
    attack_class: sqli
    mitre:
      id: T1190
      technique: "Exploit Public-Facing Application"
      tactic: initial-access
    detection:
      lucene: |
        url.path:* " AND url.query:* AND
        (url.query:("select\ " AND "*from\ ") OR url.query:"union\ select"
         OR url.query:"sleep\(" OR url.query:information_schema
         OR url.query:("or\ " AND "1=1"))
    false_positive: |
      Legit apps with search features may pass "select" in query params. Correlate
      with status (4xx favors attack) and source IP reputation.

  # [2] XSS - reflected
  - id: R-002
    title: "Cross-Site Scripting (XSS) Attempt"
    severity: medium
    confidence: 0.8
    attack_class: xss
    mitre:
      id: T1189
      technique: "Drive-by Compromise"
      tactic: initial-access
    detection:
      lucene: |
        url.query:(script OR alert( OR onerror= OR onload= OR prompt( OR document.cookie OR "iframe src")
    false_positive: |
      Developer UA / testing tools trigger often. Check user_agent; internal/testing IPs whitelist.

  # [3] Path Traversal / LFI
  - id: R-003
    title: "Path Traversal / Local File Inclusion"
    severity: high
    confidence: 0.9
    attack_class: path_traversal
    mitre:
      id: T1083
      technique: "File and Directory Discovery"
      tactic: discovery
    detection:
      lucene: |
        url.path:("..\/" OR "..\\" OR "/etc/passwd" OR "/etc/shadow" OR "system32" OR "%2e%2e%2f" OR "..%2f")
    false_positive: |
      Nearly always malicious. Severity=high unless proven otherwise.

  # [4] Command Injection
  - id: R-004
    title: "Command Injection Attempt"
    severity: critical
    confidence: 0.85
    attack_class: command_injection
    mitre:
      id: T1059
      technique: "Command and Scripting Interpreter"
      tactic: execution
    detection:
      lucene: |
        url.query:(* "|" *"cat" OR *"|" *"id" OR *"|" *"whoami" OR *";" *"whoami"
                   OR "/bin/sh" OR "cmd.exe" OR powershell OR *"$(" *)
    false_positive: |
      Extremely high confidence when combined with 4xx/5xx response. Escalate to critical.

  # [5] Sensitive File Disclosure
  - id: R-005
    title: "Sensitive File / Source Disclosure"
    severity: critical
    confidence: 0.9
    attack_class: info_disclosure
    mitre:
      id: T1005
      technique: "Data from Local System"
      tactic: collection
    detection:
      lucene: |
        url.path:("/.env" OR "/.git" OR "/.aws" OR "/.ssh" OR "web.config" OR "*.bak"
                   OR "config.php" OR "phpinfo" OR "/dump.sql" OR "*.sql" OR "/backup")
    false_positive: |
      Real exposure if 200 returned. This is a top attacker target (seen in /, .env, geoserver probes).

  # [6] SSRF
  - id: R-006
    title: "Server-Side Request Forgery"
    severity: high
    confidence: 0.7
    attack_class: ssrf
    mitre:
      id: T1190
      technique: "Exploit Public-Facing Application"
      tactic: initial-access
    detection:
      lucene: |
        url.query:("url=http*" OR "proxy=*" OR "request=*" OR "dest=*" OR "target=*"
                   OR "uri=\d+\.\d+\.\d+\.\d+" OR "file=http*" OR "load=http*")
    false_positive: |
      Apps legitimately fetching external URLs. Verify target is internal/cloud metadata
      (169.254.169.254) for true SSRF.

  # [7] Scanners / Bot UAs
  - id: R-007
    title: "Vulnerability Scanner User-Agent"
    severity: low
    confidence: 0.7
    attack_class: scanner
    mitre:
      id: T1595.001
      technique: "Active Scanning: Scanning IP Blocks"
      tactic: reconnaissance
    detection:
      lucene: |
        user_agent.original:(sqlmap OR nuclei OR nikto OR gobuster OR dirbuster
                  OR acunetix OR nessus OR wpscan OR "OWASP ZAP" OR masscan
                  OR fuzz OR hydra OR libwww-perl OR python-requests)
    false_positive: |
      Recon noise; low severity but watch for sharp frequency increase (escalate via R-011).

  # [8] Admin / Management Panel Probing
  - id: R-008
    title: "Admin / Management Panel Probe"
    severity: medium
    confidence: 0.6
    attack_class: admin_panel_scan
    mitre:
      id: T1190
      technique: "Exploit Public-Facing Application"
      tactic: initial-access
    detection:
      lucene: |
        url.path:(/admin* OR /manager* OR /wp-admin* OR /console* OR /jenkins*
                  OR /actuator* OR /webui/* OR /geoserver/web* OR /owa* OR /exchange*
                  OR /webmail* OR /.ssh* OR /phpmyadmin*)
    false_positive: |
      Some legit admin consoles exist; combine with R-011 thresholding to find real brute-force.

  # [9] Login / Auth Endpoint Scanning
  - id: R-009
    title: "Authentication Endpoint Scan"
    severity: medium
    confidence: 0.5
    attack_class: auth_scan
    mitre:
      id: T1110.001
      technique: "Brute Force: Password Guessing"
      tactic: credential-access
    detection:
      lucene: |
        url.path:(/login* OR /signin* OR /auth* OR j_spring_security* OR /logon* OR /authenticate*)
    false_positive: |
      Normal traffic if intermittent. Escalates to brute-force via R-011.

  # [10] GEO ANOMALY - traffic from disallowed/rare geo (geo-block detected hits)
  - id: R-010
    title: "Attempted Access from Non-VN Geo (hit geo-block 403)"
    severity: low
    confidence: 0.5
    attack_class: geoblock_bypass
    mitre:
      id: T1595
      technique: "Active Scanning"
      tactic: reconnaissance
    detection:
      lucene: |
        http.response.status_code:403 AND url.path:/
    false_positive: |
      geo-block returns 403 to non-VN IPs by design. Watch for repeated source trying
      across many paths (fuzzing) -> escalate.

  # [11] FREQUENCY - Single IP high request rate (scan/brute force)
  - id: R-011
    title: "High Request Rate - Single Source (Scan / Brute-force)"
    severity: medium
    confidence: 0.7
    attack_class: transverse_freq
    mitre:
      id: T1595
      technique: "Active Scanning"
      tactic: reconnaissance
    detection:
      # Implemented in transform: GROUP BY client.ip, HAVING count > threshold in window
      logic: |
        transform aggregating count(url) by client.ip over 10m;
        alert if count >= 30 OR count(distinct url.path) >= 15
    false_positive: |
      Legit crawling/CDN bursts. Raise threshold to taste; correlate with R-001..008.

  # [12] ATTACK CHAIN - source that triggered any critical+ then continued
  - id: R-012
    title: "Potential Attack Chain (Persistent Source)"
    severity: high
    confidence: 0.75
    attack_class: attack_chain
    mitre:
      id: "T1090"
      technique: "Multiple Techniques (correlated chain)"
      tactic: multiple-tactics
    detection:
      logic: |
        Same client.ip appearing in >=2 distinct severity>=high rule hits within 15m
        or a source seen scanning then hitting an app (recon->exploit).
    false_positive: |
      Low; a source hitting multiple critical patterns is almost certainly malicious.

  # [13] CROSS-SOURCE CORRELATION - firewall + web (multi-layer attacker)
  - id: R-013
    title: "Firewall+Web Correlation - Multi-Layer Attacker"
    severity: medium
    confidence: 0.85
    attack_class: cross_source_correlation
    mitre:
      id: T1595
      technique: "Active Scanning (multi-layer recon)"
      tactic: reconnaissance
    detection:
      logic: |
        Same source.ip present in fire-ufw-* (event.action=block) AND in nginx-access-*
        (client.ip) within the same detection window => attacker probing firewall layer
        who also reached the web tier. severity scales with web hit count.
    false_positive: |
      Low; a source explicitly blocked by UFW that still reached nginx is a deliberate
      multi-layer attempt (requires passing the allow-list). Severity medium unless
      web_hits >= 10 (then high).

  # [14] SSH BRUTE-FORCE - repeated failed authentications
  - id: R-014
    title: "SSH Brute-Force - Repeated Failed Logins"
    severity: high
    confidence: 0.9
    attack_class: ssh_bruteforce
    mitre:
      id: T1110.001
      technique: "Brute Force: Password Guessing"
      tactic: credential-access
    detection:
      logic: |
        Aggregate event.outcome=failure by source.ip in auth-* within window;
        alert if failures >= SOC_SSH_FAIL (default 5).
    false_positive: |
      Distributed/TOR scan sources; automated credential-stuffing bots dominate.
      Verify legit VPN/admin ranges.

  # [15] SSH CROSS-SOURCE CORRELATION - host-layer + network attacker
  - id: R-015
    title: "SSH Cross-Source Correlation - Host+Network Attacker"
    severity: medium
    confidence: 0.7
    attack_class: ssh_cross_source
    mitre:
      id: T1078
      technique: "Valid Accounts"
      tactic: persistence
    detection:
      logic: |
        source.ip active in SSH (successful login OR repeated failures) in auth-* AND
        also present in nginx-access-* (web) and/or fire-ufw-* (blocked) in the window.
        Host-layer foothold combined with web/network activity.
    false_positive: |
      Admin or VPN source IP may legitimately hit both web and SSH; list trusted IPs in
      SOC_ALLOWED_IPS to downgrade severity.

  # [16] FILE INTEGRITY CORRELATION - sensitive file modified by non-trusted process
  #      (in-host correlation on the local Windows client via winlogbeat Security 4663)
  - id: R-016
    title: "Sensitive File Modified - Integrity Correlation"
    severity: high
    confidence: 0.8
    attack_class: file_integrity
    mitre:
      id: T1070
      technique: "Indicator Removal on Host"
      tactic: defense-evasion
    detection:
      logic: |
        Windows Security event 4663 (Object Access / File System) on winlogbeat-*
        where ObjectName is on a sensitive path (hosts, System32\config, Startup,
        .ssh, .env, web.config, inetpub) AND the access is a MUTATION
        (WriteData/AppendData/Delete/ChangePermissions) AND the ProcessName is not
        on the trusted list (SOC_INTEGRITY_TRUSTED_PROCS or OS baseline).
        Join is by PROCESS + path + time within the one host — these events carry
        NO source.ip, so unlike R-013/014/015 this correlation is NOT IP-based.
        Depends on 'File System' audit (auditpol subcategory + SACL on the folder);
        until enabled there are no findings (expected).
    false_positive: |
      Windows Update / legitimate installers may write under System32. Trusted OS
      processes (svchost, lsass, explorer, ...) are pre-excluded; verify any other
      process and add it to SOC_INTEGRITY_TRUSTED_PROCS if expected.

  # [17] SYSMON FILE CREATE CORRELATION - file created in sensitive location (has hash)
  #      (in-host FIM enhancement: Sysmon event 11 on Microsoft-Windows-Sysmon/Operational,
  #       winlogbeat-* — richer than 4663 because it carries file name + SHA256 hash)
  - id: R-017
    title: "Sysmon File Created in Sensitive Location"
    severity: high
    confidence: 0.8
    attack_class: file_integrity
    mitre:
      id: T1070
      technique: "Indicator Removal on Host"
      tactic: defense-evasion
    detection:
      logic: |
        Sysmon event 11 (FileCreate) on winlogbeat-* where TargetFilename is under
        a sensitive path: Startup folder, .ssh, inetpub/webroot, *.env, web.config.
        Ships the file hash (file.hash.sha256) so findings can be cross-checked
        against IOC/lookups. Requires Sysmon installed (sysmon/sysmon-config.xml)
        and the Microsoft-Windows-Sysmon/Operational channel enabled in winlogbeat.
        Complements R-016 (Security 4663) with a stronger, hash-carrying signal.
        Join is host-local by TargetFilename + process + time (no source.ip).
    false_positive: |
      Legit installer/autostart entries may drop files into Startup. Whitelist known
      good processes (add to SOC_INTEGRITY_TRUSTED_PROCS / Sysmon config exclude) and
      verify hash against expected software catalog.

  # [18] SYSMON PROCESS LAUNCH FROM STARTUP - persistence execution
  #      (Sysmon event 1 ProcessCreate, Image under Startup -> indicates a
  #       persistence attempt being executed, e.g. dropped malware autostart)
  - id: R-018
    title: "Sysmon Process Launched from Startup Path"
    severity: high
    confidence: 0.75
    attack_class: persistence
    mitre:
      id: T1547.001
      technique: "Boot or Logon Autostart Execution: Registry Run Keys / Startup Folder"
      tactic: persistence
    detection:
      logic: |
        Sysmon event 1 (ProcessCreate) on winlogbeat-* where Image resolves under
        the Startup folder (User or Common) AND the parent process is NOT 'explorer.exe'
        (legit interaction) nor a trusted OS process. Combined with R-017 (file dropped
        in Startup) this forms a persistence chain. Requires Sysmon installed.
    false_positive: |
      User manually running a shortcut from Startup launches via explorer (excluded).
      Some legitimate autostart apps (Office, telemetry) install services; whitelist
      known vendor images in Sysmon config.

# NOTE ON TRIAL LICENSE:
# The Elastic trial (your current license, expiry soon->Basic) ENABLES Watcher + Detection Rules + Transforms
# while active, but these STOP or are restricted when it drops to Basic.
# To make the SOC durable, R-011/R-012 (aggregation/freq/chain) are implemented with
# TRANSFORMS (available in Basic for standard usage) + a scheduled tripwire script,
# so detection keeps working on the free tier.
