name: CI

# Offline validation of the SOC-ify artifacts: rule YAML, ingest pipeline,
# transform and script syntax. No Elasticsearch/Kibana/network needed -- so it
# runs in seconds on every push and PR.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  validate:
    name: Validate artifacts (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml pytest

      - name: Run artifact validation (stdlib runner)
        run: python tests/test_artifacts.py

      - name: Run with pytest
        run: python -m pytest tests/ -q

      - name: Bash syntax check
        run: bash -n scripts/deploy.sh scripts/push_github.sh

      - name: JSON artifacts parse
        run: |
          python - <<'PY'
          import json, pathlib, sys
          bad = []
          for p in pathlib.Path('.').rglob('*.json'):
              if any(part in {'.git', 'node_modules'} for part in p.parts):
                  continue
              try:
                  json.loads(p.read_text(encoding='utf-8'))
              except Exception as e:
                  bad.append(f"{p}: {e}")
          print("\n".join(bad) if bad else "all JSON parses")
          sys.exit(1 if bad else 0)
          PY
